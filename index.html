<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de herramientas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script>
  // Silencia la advertencia de desarrollo del CDN de Tailwind
  const origWarn = console.warn;
  console.warn = (...args) => {
    if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
    origWarn.apply(console, args);
  };
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: 'Barlow', system-ui, sans-serif; background: #dfe3e6; color: #1f2a30; }
  .titulo { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .01em; }
  #reader video { width: 100%; object-fit: cover; }
  #banner { transition: background-color .15s; }
</style>
</head>
<body class="min-h-screen">
<main class="max-w-xl mx-auto p-3 space-y-3">

  <header class="bg-[#1f2a30] text-white rounded-lg p-3">
    <h1 class="titulo text-2xl font-bold">Préstamo de herramientas</h1>
    <div class="mt-2 flex gap-2">
      <input id="usuario" type="text" placeholder="Nombre de quien escanea"
             class="flex-1 rounded px-3 py-2 text-[#1f2a30] disabled:bg-slate-300" autocomplete="off">
      <button id="btnUsuario" class="rounded bg-[#f08a00] text-[#1f2a30] font-semibold px-3 py-2">Guardar</button>
    </div>
  </header>

  <div id="banner" class="rounded-lg p-4 bg-white text-center font-semibold">Escanea un código para empezar</div>

  <section class="bg-white rounded-lg p-3">
    <div id="reader" class="rounded overflow-hidden bg-black min-h-[120px]"></div>
    <div class="mt-2 flex gap-2">
      <button id="btnCamara" class="flex-1 rounded bg-[#1f2a30] text-white py-2 font-semibold">Iniciar cámara</button>
    </div>
    <label class="block mt-3 text-sm font-semibold" for="scanInput">Pistola lectora USB o captura manual</label>
    <input id="scanInput" type="text" inputmode="none" autocomplete="off" autofocus
           placeholder="Escanea o escribe el código y presiona Enter"
           class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
  </section>

  <section class="bg-white rounded-lg p-3">
    <h2 class="titulo text-xl font-bold mb-1">En préstamo ahora</h2>
    <ul id="abiertos" class="divide-y divide-slate-200 text-sm"></ul>
  </section>

  <section class="bg-white rounded-lg p-3">
    <h2 class="titulo text-xl font-bold mb-1">Últimos 10 movimientos</h2>
    <ul id="ultimos" class="divide-y divide-slate-200 text-sm"></ul>
  </section>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="titulo text-xl font-bold">Artículo nuevo</h3>
    <p class="text-sm mt-1">Código: <span id="modalCodigo" class="font-semibold"></span></p>
    <input id="modalNombre" type="text" placeholder="Nombre del artículo" autocomplete="off"
           class="mt-3 w-full rounded border border-slate-300 px-3 py-2">
    <div class="mt-3 flex gap-2">
      <button id="modalCancelar" class="flex-1 rounded bg-slate-200 py-2 font-semibold">Cancelar</button>
      <button id="modalGuardar" class="flex-1 rounded bg-[#1f2a30] text-white py-2 font-semibold">Guardar y registrar</button>
    </div>
  </div>
</div>

<script>
// URL de la nueva implementación de Apps Script ya conectada:
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz4g9LoxkO2haqnDe4t7eIqpom0yFoDAJF0MhtweGCJwtDdHNOUXSM7i-0MHmVknRSnFA/exec';

const COOLDOWN_MS = 3500;
const $ = id => document.getElementById(id);
let lastScanAt = 0, busy = false, pendingCode = null, scanner = null, audioCtx = null;

// ---------- Usuario ----------
function usuarioBloqueado(b) {
  $('usuario').disabled = b;
  $('btnUsuario').textContent = b ? 'Cambiar usuario' : 'Guardar';
}
function initUsuario() {
  const u = localStorage.getItem('inv_usuario') || '';
  $('usuario').value = u;
  usuarioBloqueado(!!u);
}
$('btnUsuario').onclick = () => {
  if ($('usuario').disabled) { usuarioBloqueado(false); $('usuario').focus(); return; }
  const v = $('usuario').value.trim();
  if (!v) { $('usuario').focus(); return; }
  localStorage.setItem('inv_usuario', v);
  usuarioBloqueado(true);
  $('scanInput').focus();
};
$('usuario').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnUsuario').click(); });
const usuario = () => (localStorage.getItem('inv_usuario') || '').trim();

// ---------- Feedback ----------
function beep(freq, ms) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}
function aviso(texto, clases, sonido) {
  const b = $('banner');
  b.className = 'rounded-lg p-4 text-center font-semibold ' + clases;
  b.textContent = texto;
  if (sonido === 'toma') { beep(880, 140); setTimeout(() => beep(660, 140), 180); if (navigator.vibrate) navigator.vibrate(120); }
  if (sonido === 'devuelve') { beep(660, 140); setTimeout(() => beep(990, 200), 180); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
  if (sonido === 'error') { beep(200, 350); if (navigator.vibrate) navigator.vibrate(400); }
}

// ---------- Comunicación con Google Sheets ----------
async function enviar(payload) {
  const r = await fetch(WEBHOOK_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
    body: JSON.stringify(payload)
  });
  return r.json();
}

async function procesar(codigo, nombre) {
  busy = true;
  try {
    const res = await enviar({ codigo, nombre: nombre || '', usuario: usuario() });
    if (!res.ok) throw new Error(res.error);
    if (res.accion === 'NUEVO') { abrirModal(codigo); return; }
    if (res.accion === 'TOMADO') aviso('Artículo registrado como TOMADO: ' + res.nombre, 'bg-[#f08a00] text-[#1f2a30]', 'toma');
    if (res.accion === 'DEVUELTO') aviso('Artículo DEVUELTO correctamente: ' + res.nombre, 'bg-[#2e8b57] text-white', 'devuelve');
    cargarEstado();
  } catch (err) {
    aviso('Error: ' + err.message, 'bg-red-600 text-white', 'error');
  } finally {
    if (!pendingCode) busy = false;
  }
}

function alEscanear(texto) {
  const codigo = String(texto || '').trim();
  const ahora = Date.now();
  if (!codigo || busy || ahora - lastScanAt < COOLDOWN_MS) return;
  if (!usuario()) {
    aviso('Escribe y guarda tu nombre antes de escanear', 'bg-red-600 text-white', 'error');
    $('usuario').focus();
    return;
  }
  if (WEBHOOK_URL.startsWith('PEGA_AQUI')) {
    aviso('Falta configurar WEBHOOK_URL en el código', 'bg-red-600 text-white', 'error');
    return;
  }
  lastScanAt = ahora;
  procesar(codigo);
}

// ---------- Modal de artículo nuevo ----------
function abrirModal(codigo) {
  pendingCode = codigo;
  $('modalCodigo').textContent = codigo;
  $('modalNombre').value = '';
  $('modal').classList.remove('hidden');
  $('modalNombre').focus();
}
function cerrarModal() {
  $('modal').classList.add('hidden');
  pendingCode = null; busy = false; lastScanAt = Date.now();
  $('scanInput').focus();
}
$('modalCancelar').onclick = cerrarModal;
$('modalGuardar').onclick = async () => {
  const nombre = $('modalNombre').value.trim();
  if (!nombre) { $('modalNombre').focus(); return; }
  const codigo = pendingCode;
  $('modal').classList.add('hidden');
  pendingCode = null;
  await procesar(codigo, nombre);
  lastScanAt = Date.now();
  $('scanInput').focus();
};
$('modalNombre').addEventListener('keydown', e => { if (e.key === 'Enter') $('modalGuardar').click(); });

// ---------- Cámara ----------
$('btnCamara').onclick = async () => {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (scanner) {
    await scanner.stop().catch(() => {}); scanner = null;
    $('btnCamara').textContent = 'Iniciar cámara';
    return;
  }
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start({ facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 160 } },
      alEscanear, () => {});
    $('btnCamara').textContent = 'Detener cámara';
  } catch (err) {
    scanner = null;
    aviso('No se pudo abrir la cámara. Usa HTTPS o localhost y da permiso.', 'bg-red-600 text-white', 'error');
  }
};

// ---------- Pistola USB / Manual ----------
$('scanInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value; e.target.value = '';
  alEscanear(v);
});
document.addEventListener('click', e => {
  if (!e.target.closest('input, button, #modal')) $('scanInput').focus();
});

// ---------- Panel en vivo ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function cargarEstado() {
  if (WEBHOOK_URL.startsWith('PEGA_AQUI')) return;
  try {
    const r = await fetch(WEBHOOK_URL + '?action=estado', { redirect: 'follow' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    $('abiertos').innerHTML = d.abiertos.length
      ? d.abiertos.map(a => `<li class="py-2"><span class="font-semibold">${esc(a.nombre)}</span> <span class="text-slate-500">(${esc(a.codigo)})</span><br>La tiene ${esc(a.usuario)} desde ${esc(a.fecha)} ${esc(a.hora)}</li>`).join('')
      : '<li class="py-2 text-slate-500">No hay artículos en préstamo.</li>';
    $('ultimos').innerHTML = d.ultimos.length
      ? d.ultimos.map(m => {
          const dev = m.estado === 'DEVUELTO';
          const detalle = dev
            ? `Devuelto por ${esc(m.usuarioRegreso)} el ${esc(m.fechaRegreso)} ${esc(m.horaRegreso)}`
            : `Tomado por ${esc(m.usuarioTomo)} el ${esc(m.fechaToma)} ${esc(m.horaToma)}`;
          return `<li class="py-2 border-l-4 pl-2 ${dev ? 'border-[#2e8b57]' : 'border-[#f08a00]'}"><span class="font-semibold">${esc(m.nombre)}</span> <span class="text-slate-500">(${esc(m.codigo)})</span><br>${detalle}</li>`;
        }).join('')
      : '<li class="py-2 text-slate-500">Aún no hay movimientos.</li>';
  } catch (err) {
    $('abiertos').innerHTML = '<li class="py-2 text-red-600">No se pudo leer Google Sheets: ' + esc(err.message) + '</li>';
  }
}

initUsuario();
cargarEstado();
setInterval(cargarEstado, 20000);
</script>
</body>
</html>
